{% extends 'home/base.html' %}{% block title %}Contact{% endblock %}{% block body %}<div class="form-card"><h1 class="section-title">Get in touch</h1><p class="muted">Have a question or suggestion? Send us a message.</p><form method="post">{% csrf_token %}<label class="form-label">Name *</label><input class="form-control mb-3" name="name" required><label class="form-label">Email *</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Phone</label><input class="form-control mb-3" name="phone"><label class="form-label">Message *</label><textarea class="form-control mb-3" rows="5" name="message" required></textarea><button class="btn btn-write">Send message</button></form></div>{% endblock %}
